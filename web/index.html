<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bloomtrade ML{% endblock %}</title>

  <!-- Tailwind CSS (CDN). Los estilos de toda la app se gestionan desde este archivo. -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style type="text/tailwindcss">
    /* Paleta y fuente: cambiar aquí actualiza toda la interfaz */
    @theme {
      --color-brand-50: #fff1f3;
      --color-brand-100: #ffe0e5;
      --color-brand-500: #e11d48;
      --color-brand-600: #be123c;
      --color-brand-700: #9f1239;
      --color-leaf-500: #059669;
      --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
    }

    /* Componentes reutilizables */
    @layer components {
      .card { @apply bg-white border border-slate-200 rounded-2xl p-5 shadow-sm; }
      .card-title { @apply font-semibold text-slate-800; }
      .card-subtitle { @apply text-sm text-slate-500 mt-0.5; }
      .kpi-label { @apply text-xs text-slate-500; }
      .kpi-value { @apply text-2xl font-bold mt-1 tabular-nums; }
      .kpi-hint { @apply text-xs text-slate-400 mt-1; }

      .nav-link { @apply px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-100; }
      .nav-link--active { @apply bg-brand-50 text-brand-600 font-medium; }

      .btn { @apply inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-sm font-medium
                    transition-colors disabled:opacity-50 disabled:cursor-not-allowed; }
      .btn-primary { @apply bg-brand-500 text-white hover:bg-brand-600; }
      .btn-secondary { @apply bg-white border border-slate-300 text-slate-700 hover:bg-slate-50; }
      .btn-sm { @apply px-2.5 py-1 text-xs; }
      .input { @apply w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm
                      focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-500; }
      .label { @apply block text-xs font-medium text-slate-600 mb-1; }

      .tabla { @apply w-full text-sm; }
      .tabla th { @apply text-left text-xs font-semibold uppercase tracking-wide text-slate-500 px-3 py-2
                         border-b border-slate-200 whitespace-nowrap; }
      .tabla td { @apply px-3 py-2.5 border-b border-slate-100 whitespace-nowrap; }
      .tabla tr:hover td { @apply bg-slate-50; }
      .num { @apply text-right tabular-nums; }

      .badge { @apply inline-flex items-center text-xs px-2 py-0.5 rounded-full font-medium; }
      .badge-ok { @apply bg-emerald-100 text-emerald-700; }
      .badge-warn { @apply bg-amber-100 text-amber-700; }
      .badge-error { @apply bg-rose-100 text-rose-700; }
      .badge-neutral { @apply bg-slate-100 text-slate-600; }
      .badge-brand { @apply bg-brand-50 text-brand-600; }

      .alert { @apply rounded-xl px-4 py-3 text-sm border; }
      .alert-ok { @apply bg-emerald-50 border-emerald-200 text-emerald-800; }
      .alert-error { @apply bg-rose-50 border-rose-200 text-rose-800; }
      .alert-info { @apply bg-slate-50 border-slate-200 text-slate-700; }

      .status-pill { @apply text-xs px-2.5 py-1 rounded-full font-medium; }
      .status-pill--loading { @apply bg-slate-100 text-slate-500; }
      .status-pill--ok { @apply bg-emerald-100 text-emerald-700; }
      .status-pill--warn { @apply bg-amber-100 text-amber-700; }
      .status-pill--error { @apply bg-rose-100 text-rose-700; }

      .dropzone {
        @apply flex flex-col items-center gap-2 py-8 px-4 border-2 border-dashed border-slate-300
               rounded-2xl text-center cursor-pointer transition-colors
               hover:border-brand-500 hover:bg-brand-50;
      }
      .dropzone--over { @apply border-brand-500 bg-brand-50; }
      .chip { @apply px-3 py-1.5 rounded-full border border-slate-300 text-sm cursor-pointer hover:border-brand-500; }
      .chip--active { @apply bg-brand-500 border-brand-500 text-white; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">
  {% include "pages/components/navbar.html" %}

  <main class="max-w-7xl w-full mx-auto px-4 py-8 flex-1">
    {% block content %}{% endblock %}
  </main>

  {% include "pages/components/footer.html" %}

  <script src="{{ url_for('web.static', filename='api.js') }}"></script>
  <script src="{{ url_for('web.static', filename='ui.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
